# 한 번에 실행:  docker compose up --build   →  http://localhost:5173
# DB만:          docker compose up -d db      (백엔드·프론트는 IDE/터미널에서 실행)
# API 키는 같은 폴더의 .env 파일에 넣으세요 (.env.example 참고, .env 는 git 에 올리지 않기)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: propintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - propintel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propintel"]
      interval: 5s
      retries: 10

  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/propintel
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      MOLIT_API_KEY: ${MOLIT_API_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  propintel-db:
